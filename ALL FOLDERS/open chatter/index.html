<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Realtime Chat</title>
	<link rel="stylesheet" href="/styles.css" />
</head>
<body>
	<div id="loginView" class="card">
		<h2>Login</h2>
		<form id="loginForm">
			<input id="username" placeholder="Choose a username" required maxlength="32" />
			<input id="password" type="password" placeholder="Password (new accounts created)" required />
			<button type="submit">Enter Chat</button>
		</form>
		<div id="loginMsg" class="muted"></div>
	</div>

	<div id="chatView" class="hidden">
		<div class="sidebar">
			<h3>Online</h3>
			<ul id="onlineList"></ul>
		</div>
		<div class="chat">
			<header>
				<h2>Chat</h2>
				<div id="meInfo" class="muted"></div>
			</header>
			<ul id="messages"></ul>
			<form id="msgForm">
				<input id="msgInput" autocomplete="off" placeholder="Type a message" maxlength="500" />
				<button type="submit">Send</button>
			</form>
		</div>
	</div>

	<script src="/socket.io/socket.io.js"></script>
	<script src="/public/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page with Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto 0 auto;
            /* Add top margin to avoid overlap with navbar */
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#000;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="login-container">
        <img id="profilePhoto" src="WhatsApp Image 2025-09-23 at 18.11.15_ee6a71f0.jpg" alt="Profile photo" class="rounded-circle mx-auto d-block mb-3" style="width:120px;height:120px;object-fit:cover;">
        <!-- Added: file input to choose a photo from your computer -->
        <div class="text-center mb-3">
            <input id="photoInput" type="file" accept="image/*" class="form-control form-control-sm" />
            <!-- optional small hint -->
            <small class="text-muted">Choose a photo from your device to preview</small>
        </div>
        <h3 class="text-center mb-4">Login</h3>
        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Password">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="text-center mt-3"><a href="#">Forgot password?</a></p>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Added: preview chosen local image without uploading -->
    <script>
        // filepath: c:\Users\LENOVO\OneDrive\Desktop\LOGIN.HTML
        (function() {
            var input = document.getElementById('photoInput');
            var img = document.getElementById('profilePhoto');
            var currentObjectUrl;
            if (!input || !img) return;
            input.addEventListener('change', function() {
                var file = input.files && input.files[0];
                if (!file) return;
                // revoke previous object URL to avoid memory leak
                if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = URL.createObjectURL(file);
                img.src = currentObjectUrl;
            });
        })();
    </script>
</body>

</html>

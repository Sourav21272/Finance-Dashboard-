<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      body {
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
      }

      .todo-container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }

      h2 {
        text-align: center;
        font-weight: 600;
        color: #333;
      }

      .done {
        text-decoration: line-through;
        color: gray;
      }

      li {
        list-style: none;
        padding: 10px;
        margin: 8px 0;
        background: #f8f9fa;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: background 0.3s ease;
      }

      li:hover {
        background: #e9ecef;
      }

      input[type="checkbox"] {
        transform: scale(1.2);
        cursor: pointer;
      }

      .task-input {
        border-radius: 10px;
        padding: 10px;
        border: 1px solid #ccc;
        width: 100%;
      }

      button {
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="todo-container">
      <h2>📝 My To-Do List</h2>
      <div class="input-group my-4">
        <input id="task_name" type="text" class="form-control task-input" placeholder="Enter your task...">
        <button class="btn btn-primary" onclick="process()">Add</button>
      </div>

      <ul id="list_of_tasks" class="p-0 m-0"></ul>
    </div>

    <script>
      function process() {
        const taskName = document.getElementById("task_name").value.trim();
        if (taskName === "") {
          alert("Please enter a task!");
          return;
        }

        const li = document.createElement("li");
        const label = document.createElement("span");
        const check = document.createElement("input");

        label.textContent = taskName;
        check.type = "checkbox";
        check.classList.add("form-check-input");

        check.addEventListener("change", function () {
          if (this.checked) {
            label.classList.add("done");
          } else {
            label.classList.remove("done");
          }
        });

        li.appendChild(label);
        li.appendChild(check);

        document.getElementById("list_of_tasks").appendChild(li);
        document.getElementById("task_name").value = "";
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

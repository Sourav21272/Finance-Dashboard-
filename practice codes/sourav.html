<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Query Example</title>
  <style>
    /* Default button style for desktop/tablet */
    .my-btn {
      background-color: blue;
      color: white;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Media query for smartphones (up to 768px wide) */
    @media only screen and (max-width: 768px) {
      .my-btn {
        background-color: green; /* Change button color */
        font-size: 22px;          /* Increase font size */
        padding: 16px 32px;       /* Make it bigger */
      }
    }
  </style>
</head>
<body>
  <button class="my-btn">Click Me</button>
</body>
</html>

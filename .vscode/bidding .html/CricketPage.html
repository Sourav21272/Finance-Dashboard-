<!DOCTYPE html>
<html>
<head> <title>Player Entry</title> </head>
<body>
    <h1>Add New Player</h1>
    <form action="/add-player" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Player Name" required><br>
        <select name="category">
            <option value="Batsman">Batsman</option>
            <option value="Bowler">Bowler</option>
        </select><br>
        <h3>Past Stats (Manual)</h3>
        <input type="number" name="pastRuns" placeholder="Past Runs"><br>
        <input type="number" name="pastWickets" placeholder="Past Wickets"><br>
        <h3>Present Stats (PDF Upload)</h3>
        <p>Upload a PDF containing text like "Runs: 50"</p>
        <input type="file" name="statsPdf" required><br><br>
        <button type="submit">Add Player</button>
    </form>
    <a href="/rankings">View Rankings</a>
</body>
</html>

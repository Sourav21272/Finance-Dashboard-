<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Controlled Particle Universe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #video-preview { position: absolute; bottom: 20px; left: 20px; width: 200px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); z-index: 2; transform: scaleX(-1); }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff88; font-size: 24px; z-index: 10; pointer-events: none; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00ff88; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Initializing Vision AI...</div>
        <div style="font-size: 14px; margin-top: 10px; color: #aaa;">Please allow camera access.</div>
    </div>

    <video id="video-preview" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';
        import GUI from 'lil-gui';

        // --- CONFIGURATION ---
        const CONFIG = {
            particleCount: 15000,
            particleSize: 0.15,
            color: '#00aaff',
            shape: 'Saturn',
            gravity: 0,
            trails: true,
            expansion: 1.0 // Dynamic value from hands
        };

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, particles, geometry, material;
        let handLandmarker;
        let lastVideoTime = -1;
        let targetPositions = [];
        let velocities = [];
        let originalPositions = []; // Store base shape positions
        const video = document.getElementById('video-preview');
        const clock = new THREE.Clock();

        // --- SHAPE GENERATORS ---
        const Shapes = {
            Hearts: (count) => {
                const pos = [];
                for (let i = 0; i < count; i++) {
                    const t = Math.random() * Math.PI * 2;
                    // Heart parametric equation
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    let z = (Math.random() - 0.5) * 4; // Thickness
                    
                    // Random scatter to fill volume
                    const s = 0.5 + Math.random() * 0.5; 
                    x *= s * 0.2; y *= s * 0.2; z *= s;
                    pos.push(x, y, z);
                }
                return pos;
            },
            Flowers: (count) => {
                const pos = [];
                for (let i = 0; i < count; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    // Rose curve (k=4 for 8 petals)
                    const k = 4;
                    const r = Math.cos(k * theta) + 2; 
                    
                    let x = r * Math.sin(phi) * Math.cos(theta);
                    let y = r * Math.sin(phi) * Math.sin(theta);
                    let z = r * Math.cos(phi) * 0.5;

                    const spread = 2;
                    pos.push(x * spread, y * spread, z * spread);
                }
                return pos;
            },
            Saturn: (count) => {
                const pos = [];
                // 40% Planet, 60% Rings
                const planetCount = Math.floor(count * 0.4);
                
                // Planet Sphere
                for (let i = 0; i < planetCount; i++) {
                    const r = 2.5 * Math.cbrt(Math.random()); // Uniform sphere
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    pos.push(
                        r * Math.sin(phi) * Math.cos(theta),
                        r * Math.sin(phi) * Math.sin(theta),
                        r * Math.cos(phi)
                    );
                }
                // Rings
                for (let i = planetCount; i < count; i++) {
                    const inner = 3.5, outer = 7.0;
                    const r = inner + Math.random() * (outer - inner);
                    const theta = Math.random() * Math.PI * 2;
                    pos.push(
                        r * Math.cos(theta),
                        (Math.random() - 0.5) * 0.2, // Flat Y
                        r * Math.sin(theta)
                    );
                }
                return pos;
            },
            Statue: (count) => {
                // Using a TorusKnot as a "Statue" proxy since we can't load external OBJ/GLTF reliably in this snippet
                const pos = [];
                const tube = 0.8, radius = 2.5;
                const p = 2, q = 3; // Knot parameters
                
                for(let i=0; i<count; i++) {
                    const u = Math.random() * Math.PI * 2 * p;
                    const v = Math.random() * Math.PI * 2;
                    
                    // Torus Knot parametric math
                    const cu = Math.cos(u);
                    const su = Math.sin(u);
                    const quOverP = (q/p) * u;
                    const cs = Math.cos(quOverP);
                    
                    const r = radius + tube * Math.cos(v);
                    const x = r * (cu + 0.5 * cs); // Add distortion for "statue" complexity
                    const y = r * (su + 0.5 * cs);
                    const z = tube * Math.sin(v) + 2 * Math.sin(quOverP);
                    
                    pos.push(x, y - 1, z); // Center slightly
                }
                return pos;
            },
            Fireworks: (count) => {
                // Initial sphere for explosion origin
                const pos = [];
                for(let i=0; i<count; i++) {
                    pos.push(0,0,0);
                }
                return pos;
            }
        };

        // --- INIT THREE.JS ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            camera.position.y = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Particle System
            geometry = new THREE.BufferGeometry();
            updateParticleGeometry();

            // Material
            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png');
            material = new THREE.PointsMaterial({
                size: CONFIG.particleSize,
                color: CONFIG.color,
                map: sprite,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Window Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- PARTICLE LOGIC ---
        function updateParticleGeometry() {
            // Generate base shape
            let posArray = Shapes[CONFIG.shape](CONFIG.particleCount);
            
            // If Firework, we need velocity
            if (CONFIG.shape === 'Fireworks') {
                velocities = [];
                for(let i=0; i<CONFIG.particleCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const speed = 0.05 + Math.random() * 0.1;
                    velocities.push(
                        speed * Math.sin(phi) * Math.cos(theta),
                        speed * Math.sin(phi) * Math.sin(theta),
                        speed * Math.cos(phi)
                    );
                }
            }

            // Update Geometry
            const positions = new Float32Array(posArray);
            originalPositions = new Float32Array(posArray); // Save base state
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.attributes.position.needsUpdate = true;
        }

        function animateParticles() {
            const positions = geometry.attributes.position.array;
            
            // Dynamic Expansion Factor from Hand Tracking
            const expansion = CONFIG.expansion; 
            const gravity = CONFIG.gravity * 0.01;

            if (CONFIG.shape === 'Fireworks') {
                // Firework Logic: Explode outwards based on expansion
                for(let i=0; i<CONFIG.particleCount; i++) {
                    const ix = i*3;
                    
                    // Reset if expansion is low (hands close)
                    if (expansion < 0.3) {
                        positions[ix] += (0 - positions[ix]) * 0.1;
                        positions[ix+1] += (0 - positions[ix+1]) * 0.1;
                        positions[ix+2] += (0 - positions[ix+2]) * 0.1;
                    } else {
                        // Explode
                        positions[ix] += velocities[i*3] * (expansion * 5); // Speed scaled by hand distance
                        positions[ix+1] += velocities[i*3+1] * (expansion * 5) - gravity; // Gravity
                        positions[ix+2] += velocities[i*3+2] * (expansion * 5);
                        
                        // Loop back if too far
                        if (Math.abs(positions[ix]) > 20) positions[ix] = 0;
                    }
                }
            } else {
                // Standard Shape Logic: Morph towards target shape * expansion
                for(let i=0; i<CONFIG.particleCount; i++) {
                    const ix = i*3;
                    
                    // Calculate Target based on original shape * expansion
                    const tx = originalPositions[ix] * (0.2 + expansion * 2.5); // 0.2 min size
                    const ty = originalPositions[ix+1] * (0.2 + expansion * 2.5);
                    const tz = originalPositions[ix+2] * (0.2 + expansion * 2.5);

                    // Lerp towards target (smooth transition)
                    positions[ix] += (tx - positions[ix]) * 0.1;
                    positions[ix+1] += (ty - positions[ix+1]) * 0.1 - gravity; // Add gravity drop
                    positions[ix+2] += (tz - positions[ix+2]) * 0.1;

                    // Reset if gravity pulls too low
                    if (positions[ix+1] < -10) positions[ix+1] = 10;
                }
            }

            // Rotate System slowly
            particles.rotation.y += 0.002;
            
            geometry.attributes.position.needsUpdate = true;
        }

        // --- MEDIAPIPE HAND TRACKING ---
        async function initHandTracking() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            // Start Camera
            const constraints = { video: { width: 640, height: 480 } };
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                document.getElementById('loading').style.display = 'none';
            });
        }

        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, startTimeMs);
                    handleGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function handleGestures(result) {
            // Need 2 hands for "Distance/Tension" metric
            if (result.landmarks && result.landmarks.length === 2) {
                const hand1 = result.landmarks[0][8]; // Index Finger Tip
                const hand2 = result.landmarks[1][8]; // Index Finger Tip

                // Calculate Euclidean Distance (0.0 to ~1.0 in screen space)
                const distance = Math.sqrt(
                    Math.pow(hand1.x - hand2.x, 2) +
                    Math.pow(hand1.y - hand2.y, 2) +
                    Math.pow(hand1.z - hand2.z, 2)
                );

                // Map distance to expansion (Clamp between 0 and 1.5)
                // Distance usually ranges 0.05 (touching) to 0.8 (far apart)
                let targetExpansion = (distance - 0.05) * 2.0; 
                targetExpansion = Math.max(0, Math.min(targetExpansion, 2.0));

                // Smooth result
                CONFIG.expansion += (targetExpansion - CONFIG.expansion) * 0.1;

            } else {
                // If hands lost, slowly drift to default size
                CONFIG.expansion += (0.5 - CONFIG.expansion) * 0.05;
            }
        }

        // --- GUI SETUP ---
        function initGUI() {
            const gui = new GUI({ title: 'Universe Controls' });
            
            const shapeFolder = gui.addFolder('Creation Engine');
            shapeFolder.add(CONFIG, 'shape', Object.keys(Shapes)).name('Template').onChange(updateParticleGeometry);
            shapeFolder.addColor(CONFIG, 'color').name('Primary Color').onChange(c => material.color.set(c));

            const physicsFolder = gui.addFolder('Physics');
            physicsFolder.add(CONFIG, 'particleSize', 0.01, 0.5).name('Size').onChange(v => material.size = v);
            physicsFolder.add(CONFIG, 'gravity', 0, 10).name('Gravity');
            
            // Manual expansion override for debugging (readonly if tracking active?)
            // We'll leave it visually updating but driven by code
            physicsFolder.add(CONFIG, 'expansion', 0, 2).name('Expansion (Hand)').listen().disable();

            const renderFolder = gui.addFolder('Rendering');
            renderFolder.add(CONFIG, 'trails').name('Enable Trails').onChange(v => {
                // To do real trails we need FBO swapping, for simple version we just toggle opacity logic
                material.opacity = v ? 0.4 : 0.9;
            });
        }

        // --- MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            animateParticles();
            renderer.render(scene, camera);
        }

        // --- BOOTSTRAP ---
        initThree();
        initGUI();
        initHandTracking();
        animate();

    </script>
</body>
</html>
